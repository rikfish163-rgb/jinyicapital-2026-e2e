[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jinyicapital-e2e"
version = "0.1.0"
description = "Research scaffold for the 2026 Jinyi Capital end-to-end track"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
contest = [
    "pandas==2.2.3",
    "pyarrow==20.0.0",
    "pyqlib @ git+https://github.com/microsoft/qlib.git@54355232463878d2eebb91fe0ee5fa7fa1f5976c",
]
test = ["pytest==8.4.2"]

[project.scripts]
ptop-train = "ptop.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ptop = ["licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--basetemp=work/pytest-temp"
cache_dir = "work/pytest-cache"
